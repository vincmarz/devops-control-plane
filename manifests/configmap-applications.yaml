apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-control-plane-applications
  namespace: devops-control-plane
data:
  applications.yaml: |
    applications:
      - name: demo-go-color-app
        repositories:
          - provider: github
            providerRef: github-public
            role: source
            projectPath: vincmarz/demo-go-color-app
            repositoryURL: https://github.com/vincmarz/demo-go-color-app.git
            defaultBranch: main
            workflowEnabled: true
          - provider: github
            providerRef: github-public
            role: gitops
            projectPath: vincmarz/demo-app-gitops
            repositoryURL: https://github.com/vincmarz/demo-app-gitops.git
            defaultBranch: main
            consumedBy:
              - argocd
              - tekton
      - name: github-source-validation
        repositories:
          - provider: github
            providerRef: github-public
            role: source
            projectPath: vincmarz/devops-control-plane-github-source-test
            repositoryURL: https://github.com/vincmarz/devops-control-plane-github-source-test.git
            defaultBranch: main
            workflowEnabled: true
          - provider: github
            providerRef: github-public
            role: gitops
            projectPath: vincmarz/demo-app-gitops
            repositoryURL: https://github.com/vincmarz/demo-app-gitops.git
            defaultBranch: main
            consumedBy:
              - argocd
              - tekton
